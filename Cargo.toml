[workspace]
members = ["async_kvdb","btree",  "kvdb_rt", "scan", "spinlock"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Akash Kumar Sinha"]

[workspace.dependencies]
btree = { path = "btree" }
spinlock = { path = "spinlock" }
scan = { path = "scan" }
kvdb_rt = { path = "kvdb_rt" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2"

[package]
name = "kvdb"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
btree.workspace = true
scan.workspace = true
serde.workspace = true
